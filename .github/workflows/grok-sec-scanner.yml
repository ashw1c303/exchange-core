name: "Stage 3: Grok Bot #1 - Security, CVE & Bug Hunter"
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  hunt-cves-and-bugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner on Maven Dependencies
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'HIGH,CRITICAL'

      - name: Analyze Findings with Grok Bot & File Issue
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - << 'EOF'
          import json, os, subprocess, urllib.request

          trivy_data = "{}"
          if os.path.exists("trivy-results.json"):
              with open("trivy-results.json") as f:
                  trivy_data = f.read()[:8000]
          with open("pom.xml") as f:
              pom_data = f.read()

          prompt = f"""You are Grok Security & Bug Hunter Bot scanning exchange-core.
          Inspect the Trivy CVE scan results and pom.xml below. Identify the most critical outdated dependency or CVE in pom.xml that can be safely upgraded without breaking Java 11 compatibility.
          Output ONLY valid JSON with these exact keys:
          "title": concise issue title including CVE or dependency name,
          "target_file": "pom.xml",
          "remediation_instructions": specific version bump instructions in pom.xml,
          "markdown_body": detailed vulnerability analysis, blast radius, and test plan.

          Trivy Output: {trivy_data}
          pom.xml: {pom_data}"""

          req = urllib.request.Request(
              "https://api.x.ai/v1/chat/completions",
              data=json.dumps({
                  "model": "grok-3-latest",
                  "response_format": {"type": "json_object"},
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0.1
              }).encode("utf-8"),
              headers={"Content-Type": "application/json", "Authorization": f"Bearer {os.environ['XAI_API_KEY']}"}
          )
          with urllib.request.urlopen(req) as resp:
              finding = json.loads(json.loads(resp.read().decode("utf-8"))["choices"][0]["message"]["content"])

          metadata = json.dumps({
              "target_file": finding["target_file"],
              "instructions": finding["remediation_instructions"]
          })
          issue_body = f"{finding['markdown_body']}\n\n<!-- GROK_METADATA: {metadata} -->"

          subprocess.run([
              "gh", "issue", "create",
              "--title", f"[Grok SecBot] {finding['title']}",
              "--body", issue_body,
              "--label", "grok-remediate"
          ], check=True)
          EOF
