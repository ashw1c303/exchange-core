name: "Stage 2: Grok Build, Guardrails & Automated UAT"
on:
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  guardrail-and-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Execute Grok Build Guardrail & UAT Analyzer
        id: grok_guard
        continue-on-error: true
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 .aidlc/scripts/grok_build_uat.py

      - name: Run Automated UAT & OrderBook Test Suite
        if: steps.grok_guard.outcome == 'success'
        run: mvn test -Dtest=OrderBookDirectImplTest,OrderBookNaiveImplTest -B

      - name: Publish Guardrail & Human QA Checklist to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('grok_uat_report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail Job if Guardrails Were Violated
        if: steps.grok_guard.outcome == 'failure'
        run: exit 1
